<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Patient File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-gray-800 min-h-screen p-10 flex items-center justify-center">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
        <div class="bg-slate-900 p-6 text-white flex items-center gap-4">
            <i class="fas fa-user-edit text-3xl text-blue-400"></i>
            <div>
                <h1 class="text-2xl font-bold">Update File: {{ record['patient_name'] }}</h1>
                <p class="text-slate-400 text-sm">Authorized Write-Access Granted (Level 3)</p>
            </div>
        </div>
        <form method="post" class="p-8 space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            {% if error %}<p class="text-red-700 bg-red-50 p-3 rounded">{{ error }}</p>{% endif %}
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wider">Current Diagnosis</label>
                <input type="text" name="diagnosis" value="{{ record['diagnosis'] }}" required maxlength="500"
                       class="w-full px-4 py-3 bg-slate-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-gray-900">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wider">Prescribed Medicines</label>
                <input type="text" name="medicines" value="{{ record['prescribed_medicines'] }}" required maxlength="500"
                       class="w-full px-4 py-3 bg-slate-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-gray-900">
                <p class="text-xs text-gray-500 mt-2">Changes are recorded in the security audit log.</p>
            </div>
            <div class="pt-4 border-t border-gray-100 flex justify-end gap-4">
                <a href="/patient/{{ record['id'] }}" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold rounded-lg">Cancel</a>
                <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-md">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</body>
</html>
