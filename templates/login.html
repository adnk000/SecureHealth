<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SecureHealth Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="font-sans relative overflow-hidden bg-slate-950">
    <div id="tsparticles" class="fixed inset-0 z-0"></div>
    <div class="h-screen flex items-center justify-center relative z-10">
        <div class="bg-white/95 backdrop-blur-sm p-10 rounded-2xl shadow-xl w-96 border border-gray-100">
            <div class="flex items-center justify-center mb-10">
                <span class="text-5xl">🏥</span>
                <h2 class="text-3xl font-extrabold ml-4 text-gray-950 tracking-tight">SecureHealth</h2>
            </div>
            {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm font-bold">{{ error }}</div>
            {% endif %}
            <form method="post" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Username</label>
                    <input type="text" name="username" required autocomplete="username" class="w-full px-4 py-2.5 bg-slate-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="passwordField" required autocomplete="current-password" class="w-full px-4 py-2.5 bg-slate-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10">
                        <button type="button" id="togglePassword" aria-label="Show or hide password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-md">
                    <i class="fas fa-right-to-bracket"></i> Access Secure Database
                </button>
            </form>
            <p class="mt-8 text-xs text-gray-500 text-center border-t border-gray-100 pt-5">
                Demonstration accounts are listed in the project README. Do not reuse demo passwords.
            </p>
        </div>
    </div>
    <script>
        if (window.tsParticles) {
            tsParticles.load("tsparticles", {
                background: { color: "#0a0f1e" },
                fpsLimit: 60,
                interactivity: { events: { onClick: { enable: true, mode: "push" }, onHover: { enable: true, mode: "repulse" }, resize: true }, modes: { push: { quantity: 4 }, repulse: { distance: 100, duration: 0.4 } } },
                particles: { color: { value: "#3b82f6" }, links: { color: "#3b82f6", distance: 150, enable: true, opacity: 0.3, width: 1 }, move: { enable: true, speed: 1.5 }, number: { density: { enable: true, area: 1000 }, value: 70 }, opacity: { value: 0.5 }, shape: { type: "circle" }, size: { value: { min: 1, max: 4 } } }
            });
        }
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('passwordField');
        const eyeIcon = document.getElementById('eyeIcon');
        togglePassword.addEventListener('click', function () {
            const show = passwordField.type === 'password';
            passwordField.type = show ? 'text' : 'password';
            eyeIcon.classList.toggle('fa-eye', !show);
            eyeIcon.classList.toggle('fa-eye-slash', show);
        });
    </script>
</body>
</html>
